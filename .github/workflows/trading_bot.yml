name: Market Execution Bot

# ⏰ Scheduled externally via Google Cloud Scheduler (11:00 AM America/New_York, Mon-Fri)
# 🚀 'workflow_dispatch' allows Cloud Scheduler or manual runs via the GitHub UI/API
on:
  workflow_dispatch:

# 👇 ADD THIS BLOCK TO SILENCE THE NODE.JS WARNING 👇
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  run-trading-bot:
    runs-on: ubuntu-latest
    
    steps:
      # 1. Grab your code from the repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Spin up a fresh Python server
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Install exactly the tools your bot needs
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Run the pure math & AI logic
      - name: Execute Trading Bot
        env:
          # This pulls your hidden API keys from GitHub Secrets and safely hands them to Python
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}

          # --- THE VARIABLES (Optional: Add any you put in the Variables tab here) ---
          EMAIL: ${{ vars.EMAIL }}
          INVEST_PER_TRADE: ${{ vars.INVEST_PER_TRADE }}
          SENIOR_DRAFT_LIMIT: ${{ vars.SENIOR_DRAFT_LIMIT }}
          SCANNER_SMA_MULTIPLIER: ${{ vars.SCANNER_SMA_MULTIPLIER }}
          GOOGLE_SHEET_NAME: ${{ vars.GOOGLE_SHEET_NAME }}

        run: |
          python bot.py
